name: Budowanie aplikacji JAWIJK WOD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Budowanie APK
        run: gradle assembleDebug

      - name: Udostępnienie APK
        uses: actions/upload-artifact@v4
        with:
          name: JAWIJK-WOD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
