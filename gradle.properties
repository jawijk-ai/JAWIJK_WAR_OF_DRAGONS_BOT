# Włączenie nowoczesnych bibliotek AndroidX (wymagane przez appcompat, material design itp.)
android.useAndroidX=true

# Automatyczna konwersja starszych bibliotek do standardu AndroidX
android.enableJetifier=true

# Dodatkowe optymalizacje dla kompilacji Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.defaults.buildfeatures.buildconfig=true
